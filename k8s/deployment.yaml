apiVersion: apps/v1
kind: Deployment
metadata:
  name: shiro-bot
  namespace: ibuki-shiro-bot
  labels:
    app: shiro-bot
spec:
  replicas: 1

  selector:
    matchLabels:
      app: shiro-bot
  template:
    metadata:
      labels:
        app: shiro-bot
    spec:
      imagePullSecrets:
        - name: shiro-bot-harbor-regcred
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w 3 shiro-db 3306; do
                echo "Waiting for MySQL..."
                sleep 3
              done
      containers:
        - name: bot
          image: registry.uniproject.jp/ibuki/shiro-bot:2.1.8
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: shiro-bot
            - configMapRef:
                name: shiro-bot-config
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
